name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          for f in bin/casper-ctl install.sh uninstall.sh tests/run.sh; do bash -n "$f"; done
          shellcheck -S warning bin/casper-ctl install.sh uninstall.sh tests/run.sh
          python3 -m py_compile gui/casper-gui.py
      - name: Offline tests (fake EC image)
        run: ./tests/run.sh
