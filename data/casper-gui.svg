<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d2b"/>
      <stop offset="1" stop-color="#0c0d14"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="110" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#18d4ff"/>
    </linearGradient>
    <linearGradient id="fanglow" gradientUnits="userSpaceOnUse" x1="-28" y1="0" x2="28" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#18d4ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- fan -->
  <circle cx="64" cy="50" r="31" fill="none" stroke="#e9eaf2" stroke-opacity=".25" stroke-width="3"/>
  <g transform="translate(64 50)" fill="url(#fanglow)">
    <path id="b" d="M0-4 C10-6 14-22 2-28 C-8-24 -8-10 0-4Z"/>
