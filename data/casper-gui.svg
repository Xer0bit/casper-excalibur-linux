    <use xlink:href="#b" transform="rotate(240)"/>
    <circle r="4" fill="#e9eaf2"/>
  </g>
  <!-- keyboard strip -->
  <rect x="18" y="94" width="92" height="20" rx="6" fill="#262839"/>
  <g fill="url(#glow)">
    <rect x="23" y="99" width="10" height="10" rx="2.5"/><rect x="36" y="99" width="10" height="10" rx="2.5"/>
    <rect x="49" y="99" width="30" height="10" rx="2.5"/>
    <rect x="82" y="99" width="10" height="10" rx="2.5"/><rect x="95" y="99" width="10" height="10" rx="2.5"/>
  </g>
